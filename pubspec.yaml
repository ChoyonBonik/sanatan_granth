name: sanatan_granth
description: "Sanatan Granth — Read, listen to, and contribute Hindu sacred scriptures."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Dependency Injection & Service Locator
  get_it: ^7.7.0

  # Navigation & Deep Linking
  go_router: ^14.2.0

  # Backend, Authentication & Cloud Storage
  supabase_flutter: ^2.5.6

  # Local Persistence & SQLite Caching (Drift)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Functional Error Handling
  dartz: ^0.10.1

  # Network Info
  connectivity_plus: ^6.0.3

  # PDF & Document Reader
  pdfrx: ^1.0.67

  # Audiobooks & Media Session
  just_audio: ^0.9.38
  audio_service: ^0.18.15
  audio_session: ^0.1.19
  flutter_tts: ^4.0.2

  # Typography & Multilingual Script Support
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0

  # Community Contribution & File Processing
  file_picker: ^8.0.5
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/samples/
